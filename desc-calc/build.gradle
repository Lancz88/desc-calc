plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'war'
}

group = 'com.getbridge'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation("org.apache.commons:commons-csv:1.14.1")
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}

// Real loopback HTTP checks with a simulated panel; no MSFS or test libraries required.
sourceSets {
    msfsIntegration {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('msfsIntegrationTest', JavaExec) {
    dependsOn msfsIntegrationClasses
    classpath = sourceSets.msfsIntegration.runtimeClasspath
    mainClass = 'com.desc.calc.msfs.MSFSIntegrationCheck'
    if (project.hasProperty('msfsSnapshot') && project.hasProperty('msfsExpectedCsv')) {
        args project.property('msfsSnapshot'), project.property('msfsExpectedCsv')
    }
}

tasks.register('savedPlansIntegrationTest', JavaExec) {
    dependsOn msfsIntegrationClasses
    classpath = sourceSets.msfsIntegration.runtimeClasspath
    mainClass = 'com.desc.calc.web.SavedFlightPlanCheck'
}
