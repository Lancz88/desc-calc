plugins {
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'war'
}

group = 'com.getbridge'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation("org.apache.commons:commons-csv:1.14.0")
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}

// Real loopback HTTP checks with a simulated panel; no MSFS or test dependency downloads.
sourceSets {
    msfsIntegration {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('msfsIntegrationTest', JavaExec) {
    dependsOn msfsIntegrationClasses
    classpath = sourceSets.msfsIntegration.runtimeClasspath
    mainClass = 'com.desc.calc.msfs.MSFSIntegrationCheck'
    if (project.hasProperty('msfsSnapshot') && project.hasProperty('msfsExpectedCsv')) {
        args project.property('msfsSnapshot'), project.property('msfsExpectedCsv')
    }
}

tasks.register('savedPlansIntegrationTest', JavaExec) {
    dependsOn msfsIntegrationClasses
    classpath = sourceSets.msfsIntegration.runtimeClasspath
    mainClass = 'com.desc.calc.web.SavedFlightPlanCheck'
}
